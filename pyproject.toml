[project]
name = "ibkr-trading-bot"
version = "0.1.0"
description = "IBKR trading bot — CL1/USO time-difference strategy"
requires-python = ">=3.11"
dependencies = [
    "ib_insync>=0.9.86",
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a live IB Gateway connection (deselected by default)",
]
addopts = "-m 'not integration'"
